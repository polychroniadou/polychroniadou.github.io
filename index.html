<!DOCTYPE html>
<html>
<head>
  <!-- Page title shown in the browser tab -->
  <title>Maria | GIS Portfolio</title>
  <!-- Makes the page fit phone screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Background colour and font for the whole page */
    body { background: #e8f1f2; font-family: Arial, sans-serif; margin: 0; color: #1b2a2f; }
    /* Centred content column */
    .wrap { max-width: 800px; margin: 0 auto; padding: 24px; }
    /* Coloured header block */
    header { background: #1f6f78; color: white; padding: 40px 24px; text-align: center; }
    /* White cards for each project */
    .card { background: white; border-radius: 12px; padding: 16px; margin: 16px 0; }
    /* Images never wider than their card */
    img { max-width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <!-- Your name and one-line title -->
    <h1>WRITE YOUR NAME</h1>
    <p>WRITE YOUR ONE-LINE TITLE</p>
  </header>
  <div class="wrap">
    <!-- Copy this card block once per project -->
    <div class="card">
      <h2>PROJECT NAME</h2>
      <img src="Portfolio.jpg">
      <p>WRITE 1-2 SENTENCES</p>
      <a href="https://github.com/polychroniadou/Lesvos-Geopark">View on GitHub</a>
    </div>
  </div>
</body>
</html>
